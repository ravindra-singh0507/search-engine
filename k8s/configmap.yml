apiVersion: v1
kind: ConfigMap
metadata:
  name: search-engine-config
  namespace: search-engine
  labels:
    app: search-engine
data:
  ENV: "production"
  DATABASE_BACKEND: "postgres"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "search_engine"
  POSTGRES_USER: "search_engine"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  EVENT_BACKEND: "redis"
  PYTHONUNBUFFERED: "1"
