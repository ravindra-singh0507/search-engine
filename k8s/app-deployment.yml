apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-engine
  namespace: search-engine
  labels:
    app: search-engine
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: search-engine
      component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: search-engine
        component: api
    spec:
      containers:
        - name: search-engine
          image: search-engine:latest
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: search-engine-config
            - secretRef:
                name: search-engine-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      restartPolicy: Always
