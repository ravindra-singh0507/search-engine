apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: search-engine
  namespace: search-engine
  labels:
    app: search-engine
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - host: search-engine.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: search-engine
                port:
                  number: 80
