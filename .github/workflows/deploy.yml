name: Deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - rollback
      environment:
        description: "Target environment"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'deploy')
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:staging

      - name: Deploy to staging
        run: |
          echo "Deploying ghcr.io/${{ github.repository }}:${{ github.sha }} to staging..."
          # kubectl set image deployment/search-engine \
          #   search-engine=ghcr.io/${{ github.repository }}:${{ github.sha }} \
          #   -n search-engine --context staging
          echo "Staging deployment complete."

  deploy-production:
    name: Deploy to Production
    needs: deploy-staging
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'deploy' && inputs.environment == 'production')
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "Deploying ghcr.io/${{ github.repository }}:${{ github.sha }} to production..."
          # kubectl set image deployment/search-engine \
          #   search-engine=ghcr.io/${{ github.repository }}:${{ github.sha }} \
          #   -n search-engine --context production
          echo "Production deployment complete."

  rollback:
    name: Rollback
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'rollback'
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Rollback to previous version
        run: |
          echo "Rolling back ${{ inputs.environment }} to previous version..."
          # kubectl rollout undo deployment/search-engine \
          #   -n search-engine --context ${{ inputs.environment }}
          # kubectl rollout status deployment/search-engine \
          #   -n search-engine --context ${{ inputs.environment }}
          echo "Rollback complete."
